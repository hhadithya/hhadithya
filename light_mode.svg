<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1124" viewBox="0 0 840 1124" role="img" aria-labelledby="title description">
  <title id="title">Harindu Hadithya | Engineering profile</title>
  <desc id="description">Harindu Hadithya Nanayakkara. Final-year IT undergraduate at the University of Moratuwa, Sri Lanka. Full-stack development experience with a focus on backend and cloud engineering. I value understanding solutions, questioning assumptions, thinking about the whole system, and reviewing and taking responsibility for AI-assisted code. Backend: C# / .NET, Java / Spring Boot, Node.js. Frontend: TypeScript, React, Next.js. Databases: PostgreSQL and SQL Server. Data access: Entity Framework Core. Cloud: AWS and Azure. Infrastructure: Docker and Terraform. CI/CD: GitHub Actions. Interests: computer architecture, system design, building useful software with AI, and how AI handles language that mixes Sinhala and English. Past experience includes UI/UX, graphic design, IoT, and embedded systems. I also enjoy experimenting with music generation, teaching, and explaining technical ideas.</desc>
