<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 958" width="780" height="958" role="img" aria-label="a shell session describing Harindu Hadithya">
  <style>
    text, tspan { white-space: pre; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13.5px; }
    .bg      { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .plain   { fill: #24292f; }
    .prompt  { fill: #1a7f37; }
    .cmd     { fill: #24292f; font-weight: 600; }
    .dim     { fill: #6e7781; }
    .add     { fill: #1a7f37; }
    .chg     { fill: #9a6700; }
    .key     { fill: #953800; }
    .val     { fill: #0a3069; }
    .warn    { fill: #9a6700; }
    .cursor  { fill: #1a7f37; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="779" height="957" rx="6"/>

  <text class="plain">
    <tspan x="20" y="34"><tspan class="prompt">$</tspan> <tspan class="cmd">whoami</tspan></tspan>
    <tspan x="20" y="53">harindu hadithya<tspan class="dim"> · </tspan>final-year IT undergraduate, University of Moratuwa</tspan>
    <tspan x="20" y="72">software engineer intern<tspan class="dim"> · </tspan>backend, cloud, microservices<tspan class="dim"> · </tspan>Moratuwa, LK</tspan>

    <tspan x="20" y="110"><tspan class="prompt">$</tspan> <tspan class="cmd">terraform plan</tspan></tspan>

    <tspan x="20" y="148" class="dim">experience.digital400: Refreshing state... [id=software-engineer-intern]</tspan>

    <tspan x="20" y="186">Terraform will perform the following actions:</tspan>

    <tspan x="20" y="224" class="dim">  # software_engineer.harindu will be updated in-place</tspan>
    <tspan x="20" y="243">  <tspan class="chg">~</tspan> resource <tspan class="val">"software_engineer"</tspan> <tspan class="val">"harindu"</tspan> {</tspan>
    <tspan x="20" y="262">        <tspan class="key">id            </tspan> = <tspan class="val">"hhadithya"</tspan></tspan>
    <tspan x="20" y="281">      <tspan class="chg">~ </tspan><tspan class="key">scope         </tspan> = <tspan class="val">"implements features"</tspan> -&gt; <tspan class="val">"owns a service end to end"</tspan></tspan>
    <tspan x="20" y="300">      <tspan class="add">+ </tspan><tspan class="key">service       </tspan> = <tspan class="val">".NET 8 orchestration microservice, sole author"</tspan></tspan>
    <tspan x="20" y="319">      <tspan class="add">+ </tspan><tspan class="key">deployment    </tspan> = <tspan class="val">"docker, github actions, three environments"</tspan></tspan>
    <tspan x="20" y="338">      <tspan class="add">+ </tspan><tspan class="key">tests         </tspan> = <tspan class="val">"208, written alongside the service"</tspan></tspan>
    <tspan x="20" y="357">    }</tspan>

    <tspan x="20" y="395" class="dim">  # leadership.harindu will be created</tspan>
    <tspan x="20" y="414">  <tspan class="add">+</tspan> resource <tspan class="val">"leadership"</tspan> <tspan class="val">"harindu"</tspan> {</tspan>
    <tspan x="20" y="433">      <tspan class="add">+ </tspan><tspan class="key">co_chair      </tspan> = <tspan class="val">"Innovate with Ballerina, powered by WSO2 (2024)"</tspan></tspan>
    <tspan x="20" y="452">      <tspan class="add">+ </tspan><tspan class="key">project_lead  </tspan> = <tspan class="val">"hardware/software team, concept through prototype"</tspan></tspan>
    <tspan x="20" y="471">      <tspan class="add">+ </tspan><tspan class="key">teaching      </tspan> = <tspan class="val">"python tutoring; assembly language sessions"</tspan></tspan>
    <tspan x="20" y="490">    }</tspan>

    <tspan x="20" y="528" class="dim">  # stack.primary will be created</tspan>
    <tspan x="20" y="547">  <tspan class="add">+</tspan> resource <tspan class="val">"stack"</tspan> <tspan class="val">"primary"</tspan> {</tspan>
    <tspan x="20" y="566">      <tspan class="add">+ </tspan><tspan class="key">languages     </tspan> = [<tspan class="val">"C#"</tspan>, <tspan class="val">"Java"</tspan>, <tspan class="val">"TypeScript"</tspan>, <tspan class="val">"Python"</tspan>]</tspan>
    <tspan x="20" y="585">      <tspan class="add">+ </tspan><tspan class="key">backend       </tspan> = [<tspan class="val">".NET 8"</tspan>, <tspan class="val">"ASP.NET Core"</tspan>, <tspan class="val">"Spring Boot"</tspan>, <tspan class="val">"Node.js"</tspan>]</tspan>
    <tspan x="20" y="604">      <tspan class="add">+ </tspan><tspan class="key">data          </tspan> = [<tspan class="val">"SQL Server"</tspan>, <tspan class="val">"PostgreSQL"</tspan>, <tspan class="val">"EF Core"</tspan>]</tspan>
    <tspan x="20" y="623">      <tspan class="add">+ </tspan><tspan class="key">infrastructure</tspan> = [<tspan class="val">"Docker"</tspan>, <tspan class="val">"Terraform"</tspan>, <tspan class="val">"GitHub Actions"</tspan>, <tspan class="val">"Azure"</tspan>]</tspan>
    <tspan x="20" y="642">    }</tspan>

    <tspan x="20" y="680">Plan: <tspan class="add">2 to add</tspan>, <tspan class="chg">1 to change</tspan>, 0 to destroy.</tspan>

    <tspan x="20" y="718" class="warn">╷</tspan>
    <tspan x="20" y="737" class="warn">│ Warning: Known limitations</tspan>
    <tspan x="20" y="756" class="warn">│</tspan>
    <tspan x="20" y="775" class="warn">│   scale          = <tspan class="plain">nothing under real load yet</tspan></tspan>
    <tspan x="20" y="794" class="warn">│   frontend       = <tspan class="plain">competent, not distinguished</tspan></tspan>
    <tspan x="20" y="813" class="warn">│   infrastructure = <tspan class="plain">months of terraform, not years</tspan></tspan>
    <tspan x="20" y="832" class="warn">╵</tspan>

    <tspan x="20" y="870"><tspan class="prompt">$</tspan> <tspan class="cmd">cat ~/.interests</tspan></tspan>
    <tspan x="20" y="889">computer architecture<tspan class="dim"> · </tspan>assembly<tspan class="dim"> · </tspan>applied AI<tspan class="dim"> · </tspan>how systems actually work</tspan>

    <tspan x="20" y="927"><tspan class="prompt">$</tspan> <tspan class="cursor">█</tspan></tspan>
  </text>
</svg>
